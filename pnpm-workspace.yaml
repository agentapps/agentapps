packages:
  - 'packages/*'
  - 'apps/*'

# esbuild's install script fetches its platform-native binary; without it tsx and
# vitest cannot run. pnpm blocks dependency build scripts by default, so it has
# to be approved explicitly here. `onlyBuiltDependencies` is understood by both
# pnpm 10 (the pinned version) and pnpm 11.
onlyBuiltDependencies:
  - esbuild

# Security floors for libraries that reach the published app bundles through
# other packages. Each one stays inside the major version its dependents ask
# for; remove an entry once the dependents require the fixed version themselves.
overrides:
  'axios@<1.20.0': '^1.20.0'
  'follow-redirects@<1.16.2': '^1.16.2'
  'qs@<6.16.1': '^6.16.1'
  'nanoid@>=3.0.0 <3.3.18': '^3.3.18'
  'brace-expansion@>=2.0.0 <2.1.4': '^2.1.4'
  'brace-expansion@>=5.0.0 <5.0.9': '^5.0.9'
  'undici@>=6.0.0 <6.28.1': '^6.28.1'
  'fast-xml-parser@>=5.0.0 <5.12.0': '^5.12.0'
  # Development tools only; nothing below reaches a published package.
  'vite@>=7.0.0 <7.3.7': '^7.3.7'
  'postcss@<8.5.23': '^8.5.23'
  'markdown-it@>=14.0.0 <14.3.3': '^14.3.3'
  'js-yaml@>=4.0.0 <4.3.1': '^4.3.1'
  'js-yaml@>=3.0.0 <3.15.1': '^3.15.1'
  'source-map-js@<1.2.2': '^1.2.2'
